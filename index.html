<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09050a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f7f1f3" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ReBeFit">
  <meta name="description" content="ReBeFit Napló – személyi edzések, bérletek és elszámolás">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/cormorant-garamond-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <title>ReBeFit Napló</title>
  <script>
    // téma beállítása villanás nélkül
    try { const t = JSON.parse(localStorage.getItem('rbf-naplo-v1') || '{}')?.settings?.theme;
      if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <!-- közös SVG gradiens a progress gyűrűkhöz -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff7092"/><stop offset=".5" stop-color="#ff2f5e"/><stop offset="1" stop-color="#b80f3c"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="app">
    <main id="view" aria-live="polite"></main>
  </div>

  <nav class="tabbar" aria-label="Fő menü">
    <button class="tab" data-tab="home" aria-label="Ma">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      <span>Ma</span>
    </button>
    <button class="tab" data-tab="calendar" aria-label="Naptár">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16.5" rx="3.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="8" cy="14" r=".6" fill="currentColor"/><circle cx="12" cy="14" r=".6" fill="currentColor"/><circle cx="16" cy="14" r=".6" fill="currentColor"/><circle cx="8" cy="17.5" r=".6" fill="currentColor"/><circle cx="12" cy="17.5" r=".6" fill="currentColor"/></svg>
      <span>Naptár</span>
    </button>
    <button class="fab" data-action="quick-add" aria-label="Új alkalom">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="tab" data-tab="clients" aria-label="Kliensek">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.3-5.5 6.5-5.5s5.9 2 6.5 5.5"/><path d="M16 4.8a3.3 3.3 0 0 1 0 6.4M18 14.8c2 .7 3.2 2.5 3.5 5.2"/></svg>
      <span>Kliensek</span>
    </button>
    <button class="tab" data-tab="billing" aria-label="Elszámolás">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14v18l-2.5-1.6L14 21l-2-1.6L10 21l-2.5-1.6L5 21z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>
      <span>Elszámolás</span>
    </button>
  </nav>

  <div id="page-layer" class="page-layer"></div>
  <div id="sheet-layer"></div>
  <div id="toast-layer"></div>
  <input type="file" id="import-input" accept="application/json,.json" class="hidden">

  <script src="app.js" defer></script>
</body>
</html>
